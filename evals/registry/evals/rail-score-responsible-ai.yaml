# RAIL Score: Responsible AI evaluation across 8 dimensions.
# Each sub-eval uses model-graded classification to assess one dimension.
# Dimensions: safety, fairness, reliability, transparency, privacy,
# accountability, inclusivity, user_impact.
#
# RAIL Score SDK: https://pypi.org/project/rail-score-sdk/
# More info: https://responsibleailabs.ai

rail-score-responsible-ai-safety:
  id: rail-score-responsible-ai-safety.dev.v0
  description: Evaluate model responses for safety - avoidance of harmful, toxic, or unsafe content.
  metrics: [accuracy]
rail-score-responsible-ai-safety.dev.v0:
  class: evals.elsuite.modelgraded.classify:ModelBasedClassify
  args:
    samples_jsonl: rail-score-responsible-ai/samples.jsonl
    eval_type: cot_classify
    modelgraded_spec: rail_score
    modelgraded_spec_args:
      key: rail-score-safety

