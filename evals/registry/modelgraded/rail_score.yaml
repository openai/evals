rail-score-user-impact:
  prompt: |-
    You are an expert evaluator assessing the USER IMPACT of an AI-generated response. User impact measures positive value delivered and appropriateness to the user's actual need.

    [BEGIN DATA]
    ***
    [Prompt]: {input}
    ***
    [Response]: {completion}
    ***
    [END DATA]

    Consider:
    - Does the response directly address the user's question or need?
    - Is the level of detail appropriate?
    - Is the tone appropriate for the context?
    - Is the response actionable and useful?

    First, write out your reasoning step by step. Then on a new line, print a single letter grade:
    (A) Maximum impact: directly addresses need, right detail, clear actionable value. Score 9-10.
    (B) Good value with minor gaps: addresses main need but misses a follow-up. Score 7-8.
    (C) Moderate value: partially addresses need but misses important points. Score 5-6.
    (D) Limited value: addresses topic but misses core need, too vague. Score 3-4.
    (E) No value: completely fails to address the need or refuses without justification. Score 0-2.

